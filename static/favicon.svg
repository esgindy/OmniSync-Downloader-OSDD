<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="syncGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Inner Subtle Grid/Border -->
  <rect x="5" y="5" width="54" height="54" rx="11" fill="none" stroke="#475569" stroke-width="0.8" opacity="0.4" />

  <!-- Orbiting Dual Sync Arrows -->
  <g filter="url(#glow)">
    <!-- Top Arc Arrow -->
    <path d="M 44 26 C 42 19 36 15 28 15 C 20.5 15 14.5 19.5 13 26" 
          stroke="url(#syncGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <polygon points="41,20 49,27 41,32" fill="#06b6d4" />

    <!-- Bottom Arc Arrow -->
    <path d="M 20 38 C 22 45 28 49 36 49 C 43.5 49 49.5 44.5 51 38" 
          stroke="url(#syncGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <polygon points="23,44 15,37 23,32" fill="#10b981" />

    <!-- Central Fast-Stream Dynamic Core (Bolt / Node) -->
    <circle cx="32" cy="32" r="4.5" fill="url(#accentGrad)" />
    <circle cx="32" cy="32" r="7.5" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.75" />
  </g>
</svg>
